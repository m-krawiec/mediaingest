name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-cov
          # Install project when pyproject.toml exists
          if [ -f pyproject.toml ]; then pip install -e ".[dev]"; fi

      - name: Lint (ruff)
        run: ruff check . || echo "No Python sources to lint yet"

      - name: Type check (mypy)
        run: |
          if [ -d photo_ingest ]; then
            mypy photo_ingest
          else
            echo "No package directory yet — skipping mypy"
          fi

      - name: Test (pytest)
        run: |
          if [ -d tests ]; then
            pytest tests/ -v --tb=short
          else
            echo "No tests directory yet — skipping pytest"
          fi

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required docs exist
        run: |
          for f in docs/AGENTS.md docs/ARCHITECTURE.md docs/DATA_MODEL.md \
                   docs/IMPLEMENTATION_PLAN.md docs/MVP_SCOPE.md \
                   docs/PRODUCT_BRIEF.md TODO.md README.md config.example.yml; do
            if [ ! -f "$f" ]; then echo "MISSING: $f"; exit 1; fi
            echo "OK: $f"
          done
